# config.ini — GUAXX (versión limpia, SIN sección [SFTP])
# La antigua sección [SFTP] (host/usuario/contraseña en texto plano) se eliminó:
# ni el uploader ni el generador la usaban, y guardaba un secreto en claro.
# El uploader ahora toma la clave de la API desde .env (ver .env.example).

[RADAR]
base_input = D:/Rainview-Analyzer/Rainview-Analyzer/rainbow/online/RS19/
resolution = 100
machine_time_adjustment = 0
dbzh_gain = 0.498039
dbzh_offset = -20.5

[PROCESSING]
processor_script = ./generar_png_radar.py
output_dir = ./output
output_png_name = radar_latest.png

# El flip vertical orienta la imagen (north-up); no se aplica rotación.
rotation_degrees = 0

[GEO]
crs_radar = EPSG:4326
crs_correction = EPSG:32717

# Leaflet center: [lat, lon]
center_lat = -4.0333
center_lon = -79.8667
